name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/server/requirements.txt

      - name: Install dependencies
        run: pip install -r code/server/requirements.txt

      - name: Framework tests (routes / 501 / auth / timezone / envelope)
        working-directory: code/server
        run: python -m pytest -q

      - name: Mini program syntax check
        run: |
          for f in $(find code/miniprogram -name '*.js'); do node --check "$f"; done

      - name: Contract count check (must be 53)
        run: |
          count=$(grep -cE '^- (★ )?(ACC|TMR|TWN|BRN|SLV|PLS)-[0-9]{2} (GET|POST|PATCH|PUT|DELETE)' code/contracts/api.md)
          echo "contract endpoints: $count"
          test "$count" -eq 53